# Nginx sits in front of the FastAPI app on the production server.
# Main job besides proxying: log every request as one line of JSON, including
# how long it took (request_time, in seconds). The CloudWatch agent ships this
# log to CloudWatch Logs, and metric filters turn it into RequestCount,
# RequestLatency and 4xx/5xx error metrics.

worker_processes auto;
error_log /var/log/swe40006/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format json_access escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/swe40006/access.json.log json_access;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    upstream fastapi_app {
        server app:8000;
    }

    server {
        listen 80 default_server;
        server_name _;

        location / {
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
